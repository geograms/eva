# Keep the Gradle/R8 JVM modest so a local APK build doesn't exhaust RAM on
# developer machines (the previous 8G heap + 4G metaspace could OOM the box).
# 3G heap + 1G metaspace is ample for this app; the native libs are prebuilt and
# content-addressed, so they don't recompile here. CI can raise these if needed.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Serial execution with a small worker pool keeps peak memory predictable.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=true
